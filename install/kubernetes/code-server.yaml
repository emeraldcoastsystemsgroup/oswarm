apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-server
  namespace: oshal-kernel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
    spec:
      automountServiceAccountToken: false
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: code-server
          # Official Code Server 4.140.0; immutable multi-platform registry manifest.
          image: codercom/code-server@sha256:1c9ad972a78450f430155144110da4c02d3627c72a598e9197e2781fb9f92e28
          imagePullPolicy: IfNotPresent
          command: [/usr/bin/code-server]
          args: [--auth, none, --bind-addr, "127.0.0.1:8080", --disable-telemetry, --disable-update-check, /app/workspace-shared]
          env:
            - name: HOME
              value: /tmp/editor-home
          ports:
            - name: http-editor
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            exec:
              command: [/usr/bin/curl, --fail, --silent, --show-error, --max-time, "2", "http://127.0.0.1:8080/healthz"]
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [/usr/bin/curl, --fail, --silent, --show-error, --max-time, "2", "http://127.0.0.1:8080/healthz"]
            timeoutSeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [/usr/bin/curl, --fail, --silent, --show-error, --max-time, "2", "http://127.0.0.1:8080/healthz"]
            timeoutSeconds: 3
            periodSeconds: 20
          volumeMounts:
            - name: shared-workspace
              mountPath: /app/workspace-shared
            - name: scratch
              mountPath: /tmp
      volumes:
        - name: shared-workspace
          persistentVolumeClaim:
            claimName: oshal-workspace
        - name: scratch
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: code-server
  namespace: oshal-kernel
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: code-server
  ports:
    - name: http-editor
      port: 8080
      targetPort: http-editor
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: code-server-loopback-only
  namespace: oshal-kernel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: code-server
  policyTypes: [Ingress]
  # Defense in depth where the CNI enforces policy. The listener itself binds only to pod loopback.
  ingress: []
